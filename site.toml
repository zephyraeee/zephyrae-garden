[site]
name = "Zephyrae's Digital Garden"
source_url = "https://github.com/Chemchu/garden-engine"

[site.description]
en = "Notes, ideas and things I'm learning"
es = "Notas, ideas y cosas que estoy aprendiendo"

[[site.links]]
label = "GITHUB"
url = "https://github.com/zephyraeee"

[theme]
radius = 6

[theme.colors]
background = "#1e242c"
bright = "#dbdfe5"
primary = "#f58a07"
secondary = "#3f826d"
accent = "#bc6c25"
shade = "#323c49"

[theme.fonts.body]
family = "Inter"
fallback = "sans-serif"

[[theme.fonts.body.faces]]
src = "fonts/inter/latin-400-normal.woff2"
weight = 400
style = "normal"
unicode_range = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fonts.body.faces]]
src = "fonts/inter/latin-ext-400-normal.woff2"
weight = 400
style = "normal"
unicode_range = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[theme.fonts.heading]
family = "Lora"
fallback = "serif"

[[theme.fonts.heading.faces]]
src = "fonts/lora/latin-700-normal.woff2"
weight = 700
style = "normal"
unicode_range = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fonts.heading.faces]]
src = "fonts/lora/latin-ext-700-normal.woff2"
weight = 700
style = "normal"
unicode_range = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[features]
news = true
chess = false
music = false
games = false
